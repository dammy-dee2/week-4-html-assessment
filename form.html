<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply/Trim URL-Scissor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0065FE;
            --dark-bg: #0B162B;
            --text-dark: #141414;
            --text-gray: #5C6F84;
            --border-color: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        header {
            padding: 24px 0;
            background: #FFFFFF;
            color: var(--text-dark);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 500;
        }

        .nav-links a.active {
            color: var(--primary);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .form-card {
            background: #FFFFFF;
            color: var(--text-dark);
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .form-card p {
            color: var(--text-gray);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #FFFFFF;
            padding: 14px;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background: #0052cc;
        }

        footer {
            background: #FFFFFF;
            color: var(--text-gray);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">✂️ SCISSOR</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="form.html" class="active">Apply / Trim URL</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-card">
            <h2>Optimize Your Link</h2>
            <p>Paste your long URL below to generate a short, customized link.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="url">Paste Long URL Here</label>
                    <input type="url" id="url" name="url" placeholder="https://example.com/long-url-path" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="domain">Domain</label>
                        <select id="domain" name="domain">
                            <option value="scissor.link">scissor.link</option>
                            <option value="custom.domain">Custom Domain</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="alias">Type Alias (Optional)</label>
                        <input type="text" id="alias" name="alias" placeholder="custom-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Applicant Email</label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="note">Purpose / Description</label>
                    <textarea id="note" name="note" rows="3" placeholder="Brief note about this link..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Trim URL ✨</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Scissor. <a href="index.html">Back to Home</a></p>
    </footer>

</body>
</html>
